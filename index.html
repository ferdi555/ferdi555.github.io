<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ferdi Kurniawan</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #00fff5;
      --text: #e8e8e8;
      --text-dim: #9a9a9a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #000;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url('./profilealun.jpg') center 15% / cover no-repeat;
      filter: blur(20px) brightness(0.25);
      transform: scale(1.5);
      z-index: 0;
    }

    body::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0, 255, 245, 0.12) 0%, transparent 70%);
      z-index: 0;
    }

    .card {
      position: relative;
      background: rgba(13, 17, 23, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 255, 245, 0.3);
      box-shadow: 0 0 25px rgba(0, 255, 245, 0.15);
      border-radius: 20px;
      padding: 35px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      z-index: 1;
    }

    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 40%;
      object-fit: cover;
      object-position: center 50%;
      transform: scale(1.2);
      border: 2px solid var(--accent);
      margin-bottom: 18px;
      box-shadow: 0 0 15px rgba(0, 255, 245, 0.5);
    }

    h1 { color: var(--accent); font-size: 24px; font-weight: 600; margin-bottom: 8px; }
    .tagline { font-size: 14px; font-style: italic; color: var(--text-dim); margin-bottom: 20px; }
    .intro { font-size: 15px; margin-bottom: 25px; color: var(--text); }

    .social-links { 
      display: flex; 
      justify-content: center; 
      gap: 14px;
      flex-wrap: wrap; 
    }
    .social-links a {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 20px; width: 48px; height: 48px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; text-decoration: none;
      transition: all 0.3s ease;
    }

    .social-links a .fa-instagram { color: #E4405F; }
    .social-links a .fa-facebook-f { color: #1877F2; }
    .social-links a .fa-whatsapp { color: #25D366; }
    .social-links a .fa-youtube { color: #FF0000; }
    .social-links a .fa-linkedin-in { color: #0A66C2; }

    .social-links a:hover {
      background: var(--accent);
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 0 15px rgba(0, 255, 245, 0.6);
    }
    .social-links a:hover i { color: #000; }

    /* TOMBOL CV */
    .btn-cv {
      display: inline-block;
      margin-top: 22px;
      padding: 12px 24px;
      background: var(--accent);
      color: #000;
      font-weight: 600;
      font-size: 14px;
      border-radius: 50px;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    .btn-cv:hover {
      box-shadow: 0 0 20px rgba(0, 255, 245, 0.6);
      transform: translateY(-2px);
    }
    .btn-cv i {
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="./profile.webp" onerror="this.src='profilealun.jpg'" alt="Foto Ferdi" class="profile-img">
    <h1>Ferdi Kurniawan</h1>
    <p class="tagline">tidak ada opsi menyerah,
                                            selagi mata masih terbuka</p>
    <p class="intro">Mari bersilaturahmi melalui platform berikut:</p>
    <div class="social-links">
      <a href="https://instagram.com/ferdi_krn" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="https://www.facebook.com/share/1AMM84PcMx/" target="_blank" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
      <a href="https://wa.me/+6285664715402" target="_blank" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
      <a href="https://youtube.com/@ferdikurniawan-k3d" target="_blank" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
      <a href="https://linkedin.com/in/username-kamu" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
    </div>
    
    <!-- TOMBOL CV PINDAH KE SINI -->
    <a href="./CV-Ferdi.pdf" class="btn-cv" target="_blank">
      <i class="fas fa-file-download"></i> Download CV
    </a>
  </div>
</body>
</html>
